name: ニュース更新

# incoming.json が更新されたとき、または画面から手動で実行したときに動きます。
# 認証は GitHub Actions が自動で用意する GITHUB_TOKEN を使うため、
# 個人アクセストークン（PAT）の発行・登録は必要ありません。
on:
  push:
    branches: [main]
    paths:
      - incoming.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに結果だけ確認する"
        type: boolean
        default: false

  # 毎営業日の朝に自動で走らせたい場合は、次の3行のコメントを外してください。
  # （新規記事がなくても、アーカイブ整理と最終更新日の付け替えだけ行います）
  # schedule:
  #   - cron: "0 22 * * 0-4"   # UTC22:00 = JST翌07:00（月〜金の朝）

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新処理を実行
        id: run
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/ai_news_ops.py --dry-run | tee result.log
          else
            python3 scripts/ai_news_ops.py | tee result.log
          fi

      - name: 変更をコミット
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "ai-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!result.log'
          if git diff --cached --quiet; then
            echo "変更はありませんでした。コミットは行いません。"
            exit 0
          fi
          git commit -m "ニュース更新（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          git push

      - name: 実行結果をまとめに出力
        if: always()
        run: |
          {
            echo "### 更新処理の結果"
            echo ""
            echo '```'
            cat result.log 2>/dev/null || echo "ログがありません"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 警告があれば見出しに出す
        if: always()
        run: |
          if grep -q '^!!' result.log 2>/dev/null; then
            grep '^!!' result.log | while read -r line; do
              echo "::warning::$line"
            done
          fi
