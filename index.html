<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<header>
  <div class="header-inner">
    <h1>AIニュースまとめ！（社内版）</h1>
    <div class="last-updated" style="margin-top:8px;font-size:12.5px;opacity:.9">最終更新：<span id="last-updated">—</span></div>
  </div>
</header>

<div class="wrap">

  <style>
    .fb-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px;}
    @media (max-width:820px){.fb-row{grid-template-columns:1fr;gap:8px}}
    .feature-banner{display:flex;flex-direction:column;justify-content:center;color:#fff;
      text-decoration:none;border-radius:13px;padding:12px 16px 13px;margin:0;
      transition:transform .15s,box-shadow .15s;}
    .feature-banner.fb-a{background:linear-gradient(120deg,#463526,#7a614a);
      box-shadow:0 3px 10px rgba(70,53,38,.18);}
    .feature-banner.fb-b{background:linear-gradient(120deg,#1e5344,#3d8a72);
      box-shadow:0 3px 10px rgba(30,83,68,.18);}
    .feature-banner:hover{transform:translateY(-2px);}
    .feature-banner.fb-a:hover{box-shadow:0 7px 18px rgba(70,53,38,.28);}
    .feature-banner.fb-b:hover{box-shadow:0 7px 18px rgba(30,83,68,.28);}
    .fb-head{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:6px;}
    .fb-tag{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:10.5px;
      letter-spacing:.06em;color:#4d1512;background:#ffe9a8;padding:2px 10px;border-radius:999px;white-space:nowrap;}
    .fb-new{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.08em;
      color:#fff;background:var(--sun);padding:2px 8px;border-radius:999px;}
    .fb-title{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;
      font-size:clamp(13.5px,1.7vw,15px);line-height:1.55;margin:0;}
    #topnews{margin:-38px 0 14px}
    .notice{display:flex;align-items:center;gap:13px;background:#fff8ea;
      border:1px solid #f2dfae;border-radius:14px;padding:13px 18px;margin:0 0 16px;
      text-decoration:none;transition:box-shadow .15s,border-color .15s;}
    .notice:hover{box-shadow:0 5px 14px rgba(192,125,0,.13);border-color:#e0bf6a;}
    .nt-tag{flex:none;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:11px;
      letter-spacing:.06em;color:#fff;background:#c07d00;padding:4px 12px;border-radius:999px;white-space:nowrap;}
    .nt-body{min-width:0;}
    .nt-name{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:14px;
      line-height:1.5;color:#1e4756;display:block;}
    .nt-sub{font-size:12.5px;color:var(--sub);line-height:1.6;display:block;margin-top:2px;}
    .nt-arrow{flex:none;margin-left:auto;color:#c07d00;font-size:15px;font-weight:700;}
    @media (max-width:640px){.notice{align-items:flex-start}.nt-arrow{display:none}}
    .more-link{display:flex;align-items:center;gap:10px;background:var(--card);
      border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 20px;
      text-decoration:none;transition:background .15s,box-shadow .15s,border-color .15s;}
    .more-link:hover{background:var(--chip);border-color:var(--primary);
      box-shadow:0 4px 12px rgba(50,90,110,.10);}
    .ml-text{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:13.5px;color:#1e4756;}
    .ml-count{font-size:11.5px;color:var(--sub);background:var(--chip);padding:2px 9px;border-radius:999px;}
    .ml-go{margin-left:auto;color:var(--primary-deep);font-size:15px;font-weight:700;transition:transform .15s;}
    .more-link:hover .ml-go{transform:translateX(3px);}
  </style>

  <div id="topnews" class="topnews"></div>

  <div class="fb-row">
    <a href="report-2026-08-book-scanning.html" class="feature-banner fb-a">
      <div class="fb-head">
        <span class="fb-tag">&#9998; Claude独自編集記事</span>
        <span class="fb-new">NEW</span>
      </div>
      <div class="fb-title">AIに読ませるため、数百万冊の本が裁断された　そして裁判所は「適法」と判断した</div>
    </a>
    <a href="report-2026-08-ai-content-quality.html" class="feature-banner fb-b">
      <div class="fb-head">
        <span class="fb-tag">&#9998; Claude独自編集記事</span>
        <span class="fb-new">NEW</span>
      </div>
      <div class="fb-title">「AIっぽい」と感じた客の半数が去った　ただし、嫌われていたのはAIではなかった</div>
    </a>
  </div>

  <a class="more-link" href="reports.html">
    <span class="ml-text">これまでの記事をすべて見る</span>
    <span class="ml-count">全14本</span>
    <span class="ml-go" aria-hidden="true">&#8250;</span>
  </a>

  <div id="list" class="grid"></div>

  <div class="panel" style="margin:30px 0 26px">
    <div class="panel-lead" style="font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:14px;color:#067e96;margin-bottom:10px">🔍 過去の記事も含めて探す</div>
    <div class="searchbox">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="キーワードで検索（例：規制 / 資格 / ChatGPT）" aria-label="ニュースをキーワードで検索">
    </div>
    <div class="chips" id="chips" role="group" aria-label="分野で絞り込み"></div>
    <div class="result-count" id="count"></div>
  </div>

  <div class="archive-box">
    <div class="archive-title">📚 これより前のニュース</div>
    <div id="archive-list"></div>
    <div class="archive-note">通信量を抑えるため、過去の記事は日付ごとに別ページへまとめています。日付をクリックすると開きます。</div>
  </div>

  <footer>本ページは公開報道をもとに社内向けに要約したものです。詳しくは各記事の出典リンクをご覧ください。</footer>
</div>
